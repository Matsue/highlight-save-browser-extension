<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Notionに保存</title>
  <link rel="stylesheet" href="../ui/common.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main>
    <section id="unconfigured" class="hidden">
      <p>まだ保存先の Notion DB が設定されていません。</p>
      <button id="open-options-setup" class="primary">設定を開く</button>
    </section>

    <form id="form" class="hidden">
      <label for="text">タイトル（選択テキスト）</label>
      <textarea id="text" rows="5" placeholder="テキストを選択してから開くか、ここに貼り付け（空ならページのタイトル）"></textarea>

      <p id="url" class="url"></p>

      <div id="page-title-field" class="hidden">
        <label for="page-title">ページのタイトル</label>
        <input id="page-title" type="text" />
      </div>

      <div id="note-field" class="hidden">
        <label for="note">メモ（任意）</label>
        <textarea id="note" rows="2"></textarea>
      </div>

      <div class="actions">
        <button id="open-options" type="button" title="設定">⚙︎</button>
        <button id="save" type="submit" class="primary">Notionに保存</button>
      </div>
      <p id="status" class="status" role="status"></p>
    </form>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
